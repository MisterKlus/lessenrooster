# Haalt elke nacht het rooster op uit TimeEdit, bouwt de site en zet ze op GitHub Pages.
# Draait ook bij elke push naar main en kan met de hand gestart worden (Actions → Run workflow).
# De TimeEdit-link staat als geheim TIMEEDIT_URL in de repository-instellingen.
name: Rooster bijwerken en publiceren

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * *' # elke nacht rond 03:17 Belgische tijd
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rooster ophalen uit TimeEdit en site bouwen
        env:
          TIMEEDIT_URL: ${{ secrets.TIMEEDIT_URL }}
          CHROME: google-chrome
          TZ: Europe/Brussels
        run: node src/build.js

      - name: Gewijzigd rooster bewaren
        run: |
          if [ -n "$(git status --porcelain src/rooster-data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rooster bijgewerkt vanuit TimeEdit"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
