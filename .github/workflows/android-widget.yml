# Bouwt de Android widget-app voor Thomas (map android/) en zet hem als download op GitHub:
# https://github.com/MisterKlus/lessenrooster/releases/download/widget-app-thomas/lessenrooster-widget.apk
# Ondertekend met de vaste sleutel (geheimen ANDROID_KEYSTORE_B64 en ANDROID_KEYSTORE_PASSWORD),
# zodat een nieuwe versie gewoon over de oude installeert.
# Daarna start de app op een emulator en worden er schermafbeeldingen gemaakt (artefact "schermafbeelding"):
# nu, in het donker en tijdens een les (klok op donderdag 1 oktober 09:15) voor de aftelklok,
# en de widget echt op het beginscherm (android/test/widget-op-beginscherm.sh).
name: Widget-app voor Android bouwen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sleutel klaarzetten
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/widget.p12"

      - name: App bouwen
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/widget.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Als download publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk lessenrooster-widget.apk
          gh release view widget-app-thomas >/dev/null 2>&1 || gh release create widget-app-thomas --title "Widget-app Thomas" --notes "Android-widget voor het lessenrooster van Thomas. Installeren: open https://misterklus.github.io/lessenrooster/thomas/ → tandwiel → Instellingen → Widget."
          gh release upload widget-app-thomas lessenrooster-widget.apk --clobber
          # Pas na de app: hieraan ziet de app dat er een nieuwe versie is (versionCode = run-nummer, zie android/app/build.gradle.kts)
          printf '{"versionCode": %s, "versionName": "1.%s", "url": "https://github.com/MisterKlus/lessenrooster/releases/download/widget-app-thomas/lessenrooster-widget.apk"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > versie.json
          gh release upload widget-app-thomas versie.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: lessenrooster-widget.apk
          retention-days: 3

  schermafbeelding:
    needs: bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # voor android/test/

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: KVM aanzetten (snellere emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb root || true
            adb shell setprop persist.sys.timezone Europe/Brussels || true
            adb install -r lessenrooster-widget.apk
            adb shell am start -W -n io.github.misterklus.lessenrooster.thomas/io.github.misterklus.lessenrooster.MainActivity
            sleep 25
            adb exec-out screencap -p > licht.png
            adb shell cmd uimode night yes
            sleep 8
            adb exec-out screencap -p > donker.png
            adb shell cmd uimode night no
            adb shell settings put global auto_time 0 || true
            adb shell date -u 100107152026.00 || true
            adb shell am force-stop io.github.misterklus.lessenrooster.thomas
            adb shell am start -W -n io.github.misterklus.lessenrooster.thomas/io.github.misterklus.lessenrooster.MainActivity
            sleep 20
            adb exec-out screencap -p > tijdens-les.png
            bash android/test/widget-op-beginscherm.sh .

      - uses: actions/upload-artifact@v4
        with:
          name: schermafbeelding
          path: '*.png'
          retention-days: 3
